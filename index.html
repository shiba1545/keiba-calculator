<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬オッズ・着順計算ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>競馬オッズ・着順計算ツール</h1>
  </header>

  <div class="container">
    <div class="config-card">
      <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div>
          <label>控除率: </label>
          <input type="number" id="deductionRate" value="0.25" step="0.01" style="width: 60px;" onchange="calculateAll()">
        </div>
        <div>
          <label>出走頭数: </label>
          <input type="number" id="horseCount" value="6" min="2" max="18" style="width: 50px;">
        </div>
        <div>
          <label>表示切替: </label>
          <select id="historySelect" onchange="calculateAll()">
            <option value="all">全表示</option>
          </select>
        </div>
      </div>
      
      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button class="btn btn-primary" onclick="confirmNextRace()">確定＆次へ (履歴更新)</button>
        <button class="btn btn-secondary" onclick="generateRandomRanks()">ランダム着順設定</button>
        <button class="btn btn-danger" onclick="resetHistory()">全リセット</button>
      </div>
    </div>

    <!-- メインテーブル -->
    <div class="table-container" style="overflow-x: auto;">
      <table id="mainTable" class="shutuba-table">
        <thead>
          <tr id="tableHeaderRow">
            <th>馬番</th>
            <th>馬名</th>
            <th>人気</th>
            <th>適正オッズ</th>
            <th>確定着順</th>
            <th>勝率</th>
            <th id="historyHeader" colspan="30">過去30レースの着順</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>

    <!-- 各種予想・オッズ計算エリア -->
    <div class="config-card" style="margin-top: 20px;">
      <h2>単勝・連勝式 予想オッズ</h2>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px;">
        <!-- 単勝 -->
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #ddd;">
          <h3>単勝</h3>
          <div style="margin-bottom: 10px;">
            <label>馬番: </label>
            <select id="tanHorse" onchange="calculateOddsSection()"></select>
          </div>
          <div>適正オッズ: <strong id="tanOdds">---</strong> 倍</div>
          <div>5,000円時払戻: <strong id="tanPay">---</strong> 円</div>
        </div>

        <!-- 馬単 -->
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #ddd;">
          <h3>馬単 (2連単) 予想</h3>
          <div style="margin-bottom: 10px;">
            1着: <select id="niren1" onchange="calculateOddsSection()"></select> 番馬 →
            2着: <select id="niren2" onchange="calculateOddsSection()"></select> 番馬
          </div>
          <div>適正オッズ: <strong id="nirenOdds">---</strong> 倍</div>
          <div>5,000円時払戻: <strong id="nirenPay">---</strong> 円</div>
        </div>

        <!-- 3連単 -->
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #ddd;">
          <h3>3連単 予想</h3>
          <div style="margin-bottom: 10px;">
            <select id="sanren1" onchange="calculateOddsSection()"></select> →
            <select id="sanren2" onchange="calculateOddsSection()"></select> →
            <select id="sanren3" onchange="calculateOddsSection()"></select>
          </div>
          <div>適正オッズ: <strong id="sanrenOdds">---</strong> 倍</div>
          <div>5,000円時払戻: <strong id="sanrenPay">---</strong> 円</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const horseNames = ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"];

    // 隠し21レース
    const extraRaceHistory = [
      [1, 3, 5, 2, 4, 6], [1, 6, 2, 3, 4, 5], [1, 5, 2, 4, 3, 6], [2, 1, 3, 4, 5, 6],
      [2, 1, 4, 3, 5, 6], [6, 1, 2, 3, 4, 5], [2, 3, 1, 4, 5, 6], [2, 3, 4, 1, 5, 6],
      [1, 3, 2, 4, 5, 6], [2, 4, 3, 1, 5, 6], [2, 5, 1, 3, 4, 6], [3, 2, 1, 4, 5, 6],
      [3, 5, 1, 2, 6, 4], [3, 1, 4, 2, 5, 6], [3, 1, 2, 4, 5, 6], [4, 1, 3, 2, 5, 6],
      [4, 1, 2, 3, 5, 6], [4, 2, 1, 3, 5, 6], [5, 1, 2, 3, 4, 6], [5, 2, 1, 3, 4, 6],
      [2, 1, 5, 3, 4, 6]
    ];

    // デフォルトの30レース初期データ
    const defaultBaseHistory = [
      [1, 2, 3, 4, 5, 6], [1, 2, 4, 3, 5, 6], [3, 1, 4, 2, 5, 6], [1, 4, 2, 3, 5, 6], [1, 3, 4, 2, 5, 6],
      [1, 4, 3, 2, 5, 6], [1, 3, 4, 5, 2, 6], [1, 3, 4, 5, 2, 6], [1, 2, 4, 5, 3, 6], [1, 4, 2, 5, 3, 6],
      [1, 3, 4, 5, 2, 6], [1, 3, 5, 4, 2, 6], [2, 1, 3, 4, 5, 6], [2, 1, 4, 3, 5, 6], [2, 3, 4, 5, 6, 1],
      [3, 1, 2, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 4, 3, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6]
    ];

    let state = {
      horseCount: 6,
      horses: [],
      historyRaces: JSON.parse(JSON.stringify(defaultBaseHistory))
    };

    function init() {
      state.horses = [];
      for (let i = 1; i <= state.horseCount; i++) {
        state.horses.push({
          num: i,
          name: horseNames[i - 1] || `馬番${i}`,
          confirmRank: "",
          winRate: 0,
          odds: 99.0,
          popularity: 1
        });
      }
      updateSelectOptions();
      calculateAll();
    }

    function calculateAll() {
      const deduction = parseFloat(document.getElementById('deductionRate').value) || 0.25;

      state.horses.forEach(h => {
        let winCount = 0;
        let total = 0;

        // 1. 隠し21レース分
        extraRaceHistory.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        // 2. 表の30レース分
        state.historyRaces.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        h.winRate = total > 0 ? winCount / total : 0;
        if (h.winRate > 0) {
          let rawOdds = (1 - deduction) / h.winRate;
          h.odds = Math.min(Math.max(Math.floor(rawOdds * 10) / 10, 1.0), 99.0);
        } else {
          h.odds = 99.0;
        }
      });

      // 人気順（オッズ昇順）の計算
      const sorted = [...state.horses].sort((a, b) => a.odds - b.odds);
      state.horses.forEach(h => {
        h.popularity = sorted.findIndex(item => item.num === h.num) + 1;
      });

      renderTable();
      calculateOddsSection();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      state.horses.forEach((h, index) => {
        const tr = document.createElement('tr');
        
        let historyTds = '';
        state.historyRaces.forEach((race, rIdx) => {
          const rank = race.indexOf(h.num) + 1;
          const rankVal = rank > 0 ? rank : '';
          historyTds += `<td><input type="number" min="1" max="${state.horseCount}" value="${rankVal}" style="width: 30px; text-align: center;" onchange="updateHistoryCell(${rIdx}, ${h.num}, this.value)"></td>`;
        });

        tr.innerHTML = `
          <td>${h.num}</td>
          <td><input type="text" value="${h.name}" style="width: 80px;" onchange="h.name=this.value; updateSelectOptions();"></td>
          <td>${h.popularity}位</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
          <td><input type="number" min="1" max="${state.horseCount}" value="${h.confirmRank}" style="width: 40px;" onchange="state.horses[${index}].confirmRank=this.value"></td>
          <td>${(h.winRate).toFixed(2)}<br><small>(${(h.winRate * 100).toFixed(1)}%)</small></td>
          ${historyTds}
        `;
        tbody.appendChild(tr);
      });
    }

    function updateHistoryCell(raceIdx, horseNum, val) {
      const numVal = parseInt(val);
      if (!isNaN(numVal) && numVal >= 1) {
        state.historyRaces[raceIdx][numVal - 1] = horseNum;
      }
      calculateAll();
    }

    function confirmNextRace() {
      let newRace = [];
      state.horses.forEach(h => {
        if (h.confirmRank) {
          newRace[parseInt(h.confirmRank) - 1] = h.num;
        }
      });
      if (newRace.filter(Boolean).length === state.horseCount) {
        state.historyRaces.shift();
        state.historyRaces.push(newRace);
        state.horses.forEach(h => h.confirmRank = "");
        calculateAll();
      } else {
        alert("確定着順を全頭分入力してください。");
      }
    }

    function generateRandomRanks() {
      let nums = Array.from({length: state.horseCount}, (_, i) => i + 1);
      nums.sort(() => Math.random() - 0.5);
      state.horses.forEach((h, i) => {
        h.confirmRank = nums[i];
      });
      renderTable();
    }

    function resetHistory() {
      state.historyRaces = JSON.parse(JSON.stringify(defaultBaseHistory));
      init();
    }

    function updateSelectOptions() {
      const ids = ['tanHorse', 'niren1', 'niren2', 'sanren1', 'sanren2', 'sanren3'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const cur = el.value;
        el.innerHTML = '';
        state.horses.forEach(h => {
          const opt = document.createElement('option');
          opt.value = h.num;
          opt.textContent = `${h.num} (${h.name})`;
          el.appendChild(opt);
        });
        if (cur) el.value = cur;
      });
    }

    function calculateOddsSection() {
      const deduction = parseFloat(document.getElementById('deductionRate').value) || 0.25;

      // 1. 単勝
      const tanNum = parseInt(document.getElementById('tanHorse').value);
      const tanHorse = state.horses.find(h => h.num === tanNum);
      if (tanHorse && tanHorse.winRate > 0) {
        document.getElementById('tanOdds').textContent = tanHorse.odds.toFixed(1);
        document.getElementById('tanPay').textContent = Math.floor(5000 * tanHorse.odds).toLocaleString();
      } else {
        document.getElementById('tanOdds').textContent = '---';
        document.getElementById('tanPay').textContent = '---';
      }

      // 2. 馬単
      const n1 = parseInt(document.getElementById('niren1').value);
      const n2 = parseInt(document.getElementById('niren2').value);
      const h1 = state.horses.find(h => h.num === n1);
      const h2 = state.horses.find(h => h.num === n2);

      if (h1 && h2 && n1 !== n2 && h1.winRate > 0 && h2.winRate > 0) {
        let prob = h1.winRate * (h2.winRate / (1 - h1.winRate));
        let rawOdds = (1 - deduction) / prob;
        let odds = Math.min(Math.max(Math.floor(rawOdds * 10) / 10, 1.0), 999.0);
        document.getElementById('nirenOdds').textContent = odds.toFixed(1);
        document.getElementById('nirenPay').textContent = Math.floor(5000 * odds).toLocaleString();
      } else {
        document.getElementById('nirenOdds').textContent = '---';
        document.getElementById('nirenPay').textContent = '---';
      }

      // 3. 3連単
      const s1 = parseInt(document.getElementById('sanren1').value);
      const s2 = parseInt(document.getElementById('sanren2').value);
      const s3 = parseInt(document.getElementById('sanren3').value);
      const sh1 = state.horses.find(h => h.num === s1);
      const sh2 = state.horses.find(h => h.num === s2);
      const sh3 = state.horses.find(h => h.num === s3);

      if (sh1 && sh2 && sh3 && s1 !== s2 && s2 !== s3 && s1 !== s3 && sh1.winRate > 0) {
        let prob = sh1.winRate * (sh2.winRate / (1 - sh1.winRate)) * (sh3.winRate / (1 - sh1.winRate - sh2.winRate));
        let rawOdds = (1 - deduction) / prob;
        let odds = Math.min(Math.max(Math.floor(rawOdds * 10) / 10, 1.0), 9999.0);
        document.getElementById('sanrenOdds').textContent = odds.toFixed(1);
        document.getElementById('sanrenPay').textContent = Math.floor(5000 * odds).toLocaleString();
      } else {
        document.getElementById('sanrenOdds').textContent = '---';
        document.getElementById('sanrenPay').textContent = '---';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      init();
    });
  </script>
</body>
</html>
