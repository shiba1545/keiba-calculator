    .shutuba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background-color: #fff;
    }
    .shutuba-table th {
      background-color: #f2f2f2;
      color: #333;
      font-weight: bold;
      border: 1px solid #ccc;
      padding: 6px 4px;
      text-align: center;
    }
    .shutuba-table td {
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
    }
    
    /* 馬番の枠色スタイル */
    .color-white  { background-color: #ffffff; color: #000; font-weight: bold; }
    .color-black  { background-color: #222222; color: #fff; font-weight: bold; }
    .color-red    { background-color: #e53935; color: #fff; font-weight: bold; }
    .color-blue   { background-color: #1e88e5; color: #fff; font-weight: bold; }
    .color-yellow { background-color: #fdd835; color: #000; font-weight: bold; }
    .color-green  { background-color: #43a047; color: #fff; font-weight: bold; }
    .color-orange { background-color: #fb8c00; color: #fff; font-weight: bold; }
    .color-pink   { background-color: #f48fb1; color: #fff; font-weight: bold; }
    .color-cyan   { background-color: #00bcd4; color: #fff; font-weight: bold; }

    .horse-name {
      font-weight: bold;
      color: #000080;
      text-align: left;
      padding-left: 8px !important;
    }

    .row-input {
      width: 45px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .control-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      cursor: pointer;
    }
    
    .sync-status {
      font-size: 0.8rem;
      color: #666;
      margin-left: auto;
    }

    function updateStatus(text) {
      const el = document.getElementById('syncStatus');
      if (el) el.textContent = text;

    // JSONBin からデータ取得
    async function fetchFromJSONBin() {
      updateStatus("クラウドから取得中...");
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 
            'X-Access-Key': JSONBIN_ACCESS_KEY
          }
        });
        if (!res.ok) throw new Error(`取得失敗: ${res.status}`);
        const data = await res.json();
        cloudDataStore = data.record || {};
        updateStatus("同期完了");
        
        const select = document.getElementById('raceSelect');
        changeRace(select ? select.value : 1);
      } catch (e) {
        console.error(e);
        updateStatus("取得エラー");
      }
    }

    // JSONBin へデータ保存
    async function saveToJSONBin() {
      updateStatus("保存中...");
      try {
        const payload = Object.keys(cloudDataStore).length === 0 ? { init: true } : cloudDataStore;
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_ACCESS_KEY
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`保存失敗: ${res.status}`);
        updateStatus("保存完了");
      } catch (e) {
        console.error(e);
        updateStatus("保存エラー");
      }
    }

          name: `馬番${i}`,
          winRate: 0,
          odds: 99.0,
          columnVal: "",
          history: defaultBaseHistory.map(race => {
            const rank = race.indexOf(i) + 1;
            return rank > 0 ? rank : "";
          })
        });
      }
    }

      const select = document.getElementById('raceSelect');
      if (select) {
        select.innerHTML = '';

          const opt = document.createElement('option');

          select.appendChild(opt);

    function updateRaceTitle(raceIndex) {
      const idx = parseInt(raceIndex) - 1;
      const locationText = raceLocations[idx] || "不明なコース";
      const titleElement = document.getElementById('raceTitle');
      if (titleElement) {
        titleElement.textContent = `第${raceIndex}回 横浜サイエンスフロンティア杯 (${locationText})`;
      }
    }

    function calculateRaceDisplay(raceIndex) {
      raceIndex = parseInt(raceIndex);
      const idx = raceIndex - 1;
      const deductionRate = 0.25;

      const currentNames = raceHorseNames[idx] || ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"];
      const savedColumns = cloudDataStore[raceIndex];
      const defaultColumns = columnHistory[idx] || [1, 2, 3, 4, 5, 6];

      state.horses.forEach((h) => {
        h.name = currentNames[h.num - 1] || `馬番${h.num}`;
        if (savedColumns && savedColumns[h.num - 1] !== undefined) {
          h.columnVal = savedColumns[h.num - 1];
        } else {
          h.columnVal = defaultColumns[h.num - 1] !== undefined ? defaultColumns[h.num - 1] : "";
        }

        let winCount = 0;
        let total = 0;

        extraRaceHistory.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        const sliced = (h.history || []).slice(0, raceIndex - 1);
        sliced.forEach(v => {
          if (v !== "" && !isNaN(v)) {
            total++;
            if (parseInt(v) === 1) winCount++;
          }
        });

        const winRate = total > 0 ? winCount / total : 0;
        h.winRate = winRate;

        if (winRate > 0) {
          let rawOdds = (1 - deductionRate) / winRate;
          let calculated = Math.floor(rawOdds * 10) / 10;
          h.odds = Math.min(Math.max(calculated, 0.1), 99.0);
        } else {
          h.odds = 99.0;
        }
      });
    }

    function updateColumnVal(horseNum, val) {
      const horse = state.horses.find(h => h.num === horseNum);
      if (horse) {
        horse.columnVal = val;
      }

      const raceSelect = document.getElementById('raceSelect');
      const currentRace = raceSelect ? raceSelect.value : 1;
      
      cloudDataStore[currentRace] = state.horses.map(h => h.columnVal);
      saveToJSONBin();
    }

    function getHorseColorClass(horseName, horseNum) {
      if (horseColorMap[horseName]) {
        return horseColorMap[horseName];
      }
      const wakuClasses = ['color-white', 'color-black', 'color-red', 'color-blue', 'color-yellow', 'color-green', 'color-orange', 'color-pink'];
      return wakuClasses[(horseNum - 1) % 8];
    }

    function renderShutubaTable() {
      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 45px;">馬番</th>
        <th style="width: 60px;">レーン</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      state.horses.forEach((h) => {
        const tr = document.createElement('tr');
        const colorClass = getHorseColorClass(h.name, h.num);

        tr.innerHTML = `
          <td class="${colorClass}">${h.num}</td>
          <td><input type="number" class="row-input" value="${h.columnVal !== undefined ? h.columnVal : ''}" onchange="updateColumnVal(${h.num}, this.value)" min="1" max="99"></td>
          <td class="horse-name">${h.name}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

        const rank = parseInt(h.history[targetIdx]) || 99;
        return { ...h, currentRank: rank };
      }).sort((a, b) => a.currentRank - b.currentRank);

      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 45px;">着順</th>
        <th style="width: 45px;">馬番</th>
        <th style="width: 60px;">レーン</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      resultList.forEach((h) => {
        const tr = document.createElement('tr');
        const colorClass = getHorseColorClass(h.name, h.num);
        const rankDisplay = (h.currentRank === "失格" || h.currentRank > 6) ? '失格' : `${h.currentRank}着`;

        tr.innerHTML = `
          <td style="font-weight: bold; color: #d32f2f;">${rankDisplay}</td>
          <td class="${colorClass}">${h.num}</td>
          <td><input type="number" class="row-input" value="${h.columnVal !== undefined ? h.columnVal : ''}" onchange="updateColumnVal(${h.num}, this.value)" min="1" max="99"></td>
          <td class="horse-name">${h.name}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
