<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出馬表 | 横浜サイエンスフロンティア杯</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 出馬表固有の枠線カラー定義 */
    .waku-1 { background-color: #ffffff; color: #000000; border: 1px solid #ccc; }
    .waku-2 { background-color: #222222; color: #ffffff; }
    .waku-3 { background-color: #e53935; color: #ffffff; }
    .waku-4 { background-color: #1e88e5; color: #ffffff; }
    .waku-5 { background-color: #fdd835; color: #000000; }
    .waku-6 { background-color: #43a047; color: #ffffff; }
    
    .waku-cell {
      font-weight: bold;
      width: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>出馬表</h1>
  </header>

  <div class="container">
    <div class="config-card">
      <h2>第1回 横浜サイエンスフロンティア杯 出馬予定馬</h2>
      <p style="color: #666; font-size: 0.9rem;">開催日: 2026年9月5日 天気: 〇〇 コース: 校舎一周 〇〇m</p>
      <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">
      
      <div class="input-group" style="display: flex; align-items: center; gap: 8px;">
        <label for="raceSelect"><strong>表示: </strong></label>
        <select id="raceSelect" onchange="changeRace(this.value)" style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
          <!-- JSで自動生成 -->
        </select>
        <button id="btnShowResult" class="btn btn-secondary" onclick="showCurrentRaceResult()">結果表示</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>枠</th>
            <th>馬番</th>
            <th>馬名</th>
            <th>勝率</th>
            <th>オッズ</th>
          </tr>
        </thead>
        <tbody id="shutubaTableBody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // ページ読み込み時に1回目時点を表示
    window.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('raceSelect');
      if (select) {
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `${i}回目`;
          select.appendChild(opt);
        }
        select.value = 1;
        changeRace(1);
      }
    });

    function changeRace(raceIndex) {
      showHistoryAtRace(raceIndex);
      renderShutubaTable();
    }

    function renderShutubaTable() {
      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const wakuClasses = ['waku-1', 'waku-2', 'waku-3', 'waku-4', 'waku-5', 'waku-6'];

      state.horses.forEach((h, i) => {
        const tr = document.createElement('tr');
        const wakuClass = wakuClasses[i % 6];

        tr.innerHTML = `
          <td class="waku-cell ${wakuClass}">${i + 1}</td>
          <td>${h.num}</td>
          <td style="font-weight: bold; text-align: left; padding-left: 1rem;">${h.name}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td>${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showCurrentRaceResult() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = parseInt(raceSelect.value);
      const targetIdx = selectedRace - 1;

      let rank1 = "-", rank2 = "-", rank3 = "-";

      state.horses.forEach(h => {
        const r = String(h.history[targetIdx]);
        if (r === "1") rank1 = `馬番${h.num} (${h.name})`;
        if (r === "2") rank2 = `馬番${h.num} (${h.name})`;
        if (r === "3") rank3 = `馬番${h.num} (${h.name})`;
      });

      alert(`【第${selectedRace}回 レース結果】\n\n🥇 1着: ${rank1}\n🥈 2着: ${rank2}\n🥉 3着: ${rank3}`);
    }
  </script>
</body>
</html>
