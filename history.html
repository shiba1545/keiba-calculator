<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出馬表 | 横浜サイエンスフロンティア杯</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shutuba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background-color: #fff;
    }
    .shutuba-table th {
      background-color: #f2f2f2;
      color: #333;
      font-weight: bold;
      border: 1px solid #ccc;
      padding: 6px 4px;
      text-align: center;
    }
    .shutuba-table td {
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
    }
    
    /* 馬番の枠色スタイル */
    .waku-1 { background-color: #ffffff; color: #000; font-weight: bold; }
    .waku-2 { background-color: #222222; color: #fff; font-weight: bold; }
    .waku-3 { background-color: #e53935; color: #fff; font-weight: bold; }
    .waku-4 { background-color: #1e88e5; color: #fff; font-weight: bold; }
    .waku-5 { background-color: #fdd835; color: #000; font-weight: bold; }
    .waku-6 { background-color: #43a047; color: #fff; font-weight: bold; }
    .waku-7 { background-color: #fb8c00; color: #fff; font-weight: bold; }
    .waku-8 { background-color: #f48fb1; color: #fff; font-weight: bold; }

    .horse-name {
      font-weight: bold;
      color: #000080;
      text-align: left;
      padding-left: 8px !important;
    }

    .control-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>出馬表</h1>
  </header>

  <div class="container">
    <div class="config-card">
      <!-- タイトルが動的に変わるように id="raceTitle" を追加 -->
      <h2 id="raceTitle" style="font-size: 1.2rem; margin-bottom: 4px;">第1回 横浜サイエンスフロンティア杯 (外周 1600m) </h2>
      
      <div class="control-panel">
        <label for="raceSelect"><strong>表示: </strong></label>
        <select id="raceSelect" onchange="changeRace(this.value)">
          <!-- JSで自動生成 -->
        </select>
        <button id="btnShowResult" class="btn btn-secondary" onclick="showCurrentRaceResult()">結果表示</button>
        <button id="btnResetDisplay" class="btn btn-danger" onclick="resetToShutubaTable()">reset</button>
      </div>
    </div>

    <!-- 出馬表 -->
    <div class="table-container">
      <table class="shutuba-table">
        <thead>
          <tr id="tableHeader">
            <th style="width: 45px;">馬番</th>
            <th style="width: 50px;">印</th>
            <th>馬名</th>
            <th style="width: 70px;">勝率</th>
            <th style="width: 70px;">オッズ</th>
          </tr>
        </thead>
        <tbody id="shutubaTableBody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </div>
  <script>
    window.state = window.state || { deductionRate: 0.25, horses: [] };

    // 30回分の各レースの馬名データ（1回目〜30回目まで自由に変更可能）
    const raceHorseNames = [
      ["ハルキシャトル", "ヒダリノセネームウオ", "ツルミルツヨシ", "ヒダリニマガール", "サカモト", "ナオイゴールド"], // 1回目
      ["サイエンススズカ", "ナオイゴールド", "ケイイチパンドラ", "ヤエノササキ", "ラクラクラク", "ハイセンスサイエンス"], // 2回目
      ["ヒダリノセネームウオ", "ハルキシャトル", "ヒダリニマガール", "ツルミルツヨシ", "ナオイゴールド", "サカモト"], // 3回目
      ["ハルキシャトル", "ヒダリニマガール", "ツルミルツヨシ", "ヒダリノセネームウオ", "ナオイゴールド", "サカモト"], // 4回目
      ["ナオイゴールド", "ブドウトウフェチ", "エンサンブラック", "キシラギエース", "カスキン", "ハイセンスナサイエンス"], // 5回目
      ["エンサンブラック", "サイエンススズカ", "キシラギエース", "イノイノックス", "ゴールドシップ", "ナオイゴールド"], // 6回目
      ["ツルミルツヨシ", "ナオイゴールド", "ヒダリノセネームウオ", "サカモト", "ハルキシャトル", "ヒダリニマガール"], // 7回目
      ["サイエンススズカ", "ナオイゴールド", "ヤエノササキ", "ケイイチパンドラ", "ラクラクラク", "ハイセンスナサイエンス"], // 8回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 9回目
      ["ハルキシャトル", "ヒダリノセネームウオ", "ツルミルツヨシ", "ナオイゴールド", "ヒダリニマガール", "サカモト"],// 10回目
      ["キシラギエース", "ハイセンスナサイエンス", "ブドウトウフェチ", "カスキン", "エンサンブラック", "ナオイゴールド"],// 11回目
      ["エンサンブラック", "ナオイゴールド", "イノイノックス", "サイエンススズカ", "ゴールドシップ", "キシラギエース"], // 12回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 13回目
      ["ナオイゴールド", "ケイイチパンドラ", "ハイセンスナサイエンス", "ヤエノササキ", "サイエンススズカ", "ラクラクラク"], // 14回目
      ["ハイセンスナサイエンス", "キシラギエース", "カスキン", "ブドウトウフェチ", "ナオイゴールド", "エンサンブラック"], // 15回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 16回目
      ["エンサンブラック", "キシラギエース", "ブドウトウフェチ", "カスキン", "ハイセンスナサイエンス", "ナオイゴールド"], // 17回目
      ["エンサンブラック", "サイエンススズカ", "キシラギエース", "ナオイゴールド", "イノイノックス", "ゴールドシップ"], // 18回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 19回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 20回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 21回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 22回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 23回目
      ["サオリキャプ", "ウオｗカ", "オノフェーブル", "ツインメイド", "エルコンドルカサー", "ナオイゴールド"], // 24回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 25回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 26回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 27回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 28回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"], // 29回目
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"]  // 30回目
    ];

    // 💡 30回分の開催場所・コース条件データ
    const raceLocations = [
      "外周 1100m", "花月総持寺公園 400m 1", "学校（競歩）300m ", "外周 1100m ", "学校（競歩）300m ",
      "花月総持寺公園 皐月賞 400m ", "外周 1100m ", "花月総持寺公園 400m ", "学校（競歩） ", "外周 1100m ",
      "学校（競歩）", "花月総持寺公園 400m ", "外周 1600m ", "花月総持寺公園 400m ", "学校（競歩）300m ",
      "外周 1100m ", "学校（競歩）300m ", "花月総持寺 菊花賞 400m ", "外周 1100m ", "花月総持寺 公園 400m ",
      "学校（競歩）300m ", "外周 1100m ", "学校（競歩）300m ", "SSH（重賞）200m ", "外周 1100m ",
      "花月総持寺公園 400m ", "学校内（競歩）300m ", "外周 1100m ", "学校（競歩） 300m ", "花月総持寺公演 有馬記念（重賞）400m "
    ];
    // 💡 隠し21レースデータ
    const extraRaceHistory = [, [1, 6, 2, 3, 4, 5], [1, 5, 2, 4, 3, 6], [2, 1, 3, 4, 5, 6],
, [6, 1, 2, 3, 4, 5], [2, 3, 1, 4, 5, 6], [2, 3, 4, 1, 5, 6],
, [2, 4, 3, 1, 5, 6], [2, 5, 1, 3, 4, 6], [3, 2, 1, 4, 5, 6],
, [3, 1, 4, 2, 5, 6], [3, 1, 2, 4, 5, 6], [4, 1, 3, 2, 5, 6],
, [4, 2, 1, 3, 5, 6], [5, 1, 2, 3, 4, 6], [5, 2, 1, 3, 4, 6],
      [2, 1, 5, 3, 4, 6]
    ];

    // 💡 30回分の履歴データ
const defaultBaseHistory = [
    [1, 2, 3, 4, 5, 6], // 1回目
    [1, 2, 4, 3, 5, 6], // 2回目
    [2, 4, 1, 3, 5, 6], // 3回目
    [1, 3, 4, 2, 5, 6], // 4回目
    [1, 4, 2, 3, 5, 6], // 5回目
    [1, 4, 3, 2, 5, 6], // 6回目
    [1, 5, 2, 3, 4, 6], // 7回目
    [1, 5, 2, 3, 4, 6], // 8回目
    [1, 2, 5, 3, 4, 6], // 9回目
    [1, 3, 5, 2, 4, 6], // 10回目
    [1, 6, 2, 3, 4, 5], // 11回目
    [1, 5, 2, 4, 3, 6], // 12回目
    [2, 1, 3, 4, 5, 6], // 13回目
    [2, 1, 4, 3, 5, 6], // 14回目
    [6, 1, 2, 3, 4, 5], // 15回目
    [2, 3, 1, 4, 5, 6], // 16回目
    [2, 3, 4, 1, 5, 6], // 17回目
    [1, 3, 2, 4, 5, 6], // 18回目
    [2, 4, 3, 1, 5, 6], // 19回目
    [2, 5, 1, 3, 4, 6], // 20回目
    [3, 2, 1, 4, 5, 6], // 21回目
    [3, 5, 1, 2, 6, 4], // 22回目
    [3, 1, 4, 2, 5, 6], // 23回目
    [3, 1, 2, 4, 5, 6], // 24回目
    [4, 1, 3, 2, 5, 6], // 25回目
    [4, 1, 2, 3, 5, 6], // 26回目
    [4, 2, 1, 3, 5, 6], // 27回目
    [5, 1, 2, 3, 4, 6], // 28回目
    [5, 2, 1, 3, 4, 6], // 29回目
    [2, 1, 5, 3, 4, 6]  // 30回目
  ];

    function initHorses() {
      state.horses = [];
      for (let i = 1; i <= 6; i++) {
        state.horses.push({
          num: i,
          name: `馬番${i}`,
          winRate: 0,
          odds: 99.0,
          history: defaultBaseHistory.map(race => {
            const rank = race.indexOf(i) + 1;
            return rank > 0 ? rank : "";
          })
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initHorses();

      // レース選択肢生成
      const select = document.getElementById('raceSelect');
      if (select) {
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `${i}回目`;
          select.appendChild(opt);
        }
        select.value = 1;
      }

      changeRace(1);
    });

    // レース選択変更時
    function changeRace(raceIndex) {
      calculateRaceDisplay(raceIndex);
      updateRaceTitle(raceIndex);
      renderShutubaTable();
    }

    // 「reset」ボタン用：現在の回のまま元の出馬表（馬番順）に戻す
    function resetToShutubaTable() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = raceSelect ? raceSelect.value : 1;
      changeRace(selectedRace);
    }

    // タイトルを動的に書き換える関数
    function updateRaceTitle(raceIndex) {
      const idx = parseInt(raceIndex) - 1;
      const locationText = raceLocations[idx] || "不明なコース";
      
      const titleElement = document.getElementById('raceTitle');
      if (titleElement) {
        titleElement.textContent = `第${raceIndex}回 横浜サイエンスフロンティア杯 (${locationText})` ;
      }
    }

    function calculateRaceDisplay(raceIndex) {
      raceIndex = parseInt(raceIndex);
      const idx = raceIndex - 1;
      const deductionRate = 0.25;

      // 選ばれた回の馬名セットを取得
      const currentNames = raceHorseNames[idx] || ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"];

      state.horses.forEach((h) => {
        // 馬の名前を選ばれたレースのものに書き換える
        h.name = currentNames[h.num - 1] || `馬番${h.num}`;

        let winCount = 0;
        let total = 0;

        extraRaceHistory.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        const sliced = (h.history || []).slice(0, raceIndex - 1);
        sliced.forEach(v => {
          if (v !== "" && !isNaN(v)) {
            total++;
            if (parseInt(v) === 1) winCount++;
          }
        });

        const winRate = total > 0 ? winCount / total : 0;
        h.winRate = winRate;

        if (winRate > 0) {
          let rawOdds = (1 - deductionRate) / winRate;
          let calculated = Math.floor(rawOdds * 10) / 10;
          h.odds = Math.min(Math.max(calculated, 1.0), 99.0);
        } else {
          h.odds = 99.0;
        }
      });
    }

    // 馬番順での出馬表表示
    function renderShutubaTable() {
      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 80px;">馬番</th>
        <th style="width: 50px;">列</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const wakuClasses = ['waku-1', 'waku-2', 'waku-3', 'waku-4', 'waku-5', 'waku-6', 'waku-7', 'waku-8'];

      state.horses.forEach((h) => {
        const tr = document.createElement('tr');
        const wakuClass = wakuClasses[(h.num - 1) % 8];

        tr.innerHTML = `
          <td class="${wakuClass}">${h.num}</td>
          <td></td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 「結果表示」ボタン（1着からの順位順に並び替え）
    function showCurrentRaceResult() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = parseInt(raceSelect.value);
      const targetIdx = selectedRace - 1;

      const resultList = state.horses.map(h => {
        const rank = parseInt(h.history[targetIdx]) || 99;
        return { ...h, currentRank: rank };
      }).sort((a, b) => a.currentRank - b.currentRank);

      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 45px;">着順</th>
        <th style="width: 45px;">馬番</th>
        <th style="width: 50px;">列</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const wakuClasses = ['waku-1', 'waku-2', 'waku-3', 'waku-4', 'waku-5', 'waku-6', 'waku-7', 'waku-8'];

      resultList.forEach((h) => {
        const tr = document.createElement('tr');
        const wakuClass = wakuClasses[(h.num - 1) % 8];
        const rankDisplay = h.currentRank <= 6 ? `${h.currentRank}着` : '-';

        tr.innerHTML = `
          <td style="font-weight: bold; color: #d32f2f;">${rankDisplay}</td>
          <td class="${wakuClass}">${h.num}</td>
          <td></td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
