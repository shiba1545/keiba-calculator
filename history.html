<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出馬表 | 横浜サイエンスフロンティア杯</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* netkeiba風の出馬表スタイル */
    .shutuba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background-color: #fff;
    }
    .shutuba-table th {
      background-color: #f2f2f2;
      color: #333;
      font-weight: bold;
      border: 1px solid #ccc;
      padding: 6px 4px;
      text-align: center;
    }
    .shutuba-table td {
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
    }
    
    /* 枠色スタイル (1〜8枠対応) */
    .waku-1 { background-color: #ffffff; color: #000; font-weight: bold; }
    .waku-2 { background-color: #222222; color: #fff; font-weight: bold; }
    .waku-3 { background-color: #e53935; color: #fff; font-weight: bold; }
    .waku-4 { background-color: #1e88e5; color: #fff; font-weight: bold; }
    .waku-5 { background-color: #fdd835; color: #000; font-weight: bold; }
    .waku-6 { background-color: #43a047; color: #fff; font-weight: bold; }
    .waku-7 { background-color: #fb8c00; color: #fff; font-weight: bold; }
    .waku-8 { background-color: #f48fb1; color: #fff; font-weight: bold; }

    /* 馬名スタイル */
    .horse-name {
      font-weight: bold;
      color: #000080;
      text-align: left;
      padding-left: 8px !important;
    }

    /* 操作パネル */
    .control-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>出馬表</h1>
  </header>

  <div class="container">
    <div class="config-card">
      <h2 style="font-size: 1.2rem; margin-bottom: 4px;">第1回 横浜サイエンスフロンティア杯(2026年9月5日 GI 東京 芝1600m) 枠順</h2>
      
      <div class="control-panel">
        <label for="raceSelect"><strong>表示: </strong></label>
        <select id="raceSelect" onchange="changeRace(this.value)">
          <!-- JSで自動生成 -->
        </select>
        <button id="btnShowResult" class="btn btn-secondary" onclick="showCurrentRaceResult()">結果表示</button>
      </div>
    </div>

    <div class="table-container">
      <table class="shutuba-table">
        <thead>
          <tr>
            <th style="width: 35px;">枠</th>
            <th style="width: 40px;">馬番</th>
            <th style="width: 50px;">印</th>
            <th>馬名</th>
            <th style="width: 50px;">性齢</th>
            <th style="width: 50px;">斤量</th>
            <th style="width: 70px;">勝率</th>
            <th style="width: 70px;">オッズ</th>
          </tr>
        </thead>
        <tbody id="shutubaTableBody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // グローバル状態
    window.state = window.state || { deductionRate: 0.25, horses: [] };

    // 計算用追加21レースデータ
    const extraRaceHistory = [
      [1, 3, 5, 2, 4, 6], [1, 6, 2, 3, 4, 5], [1, 5, 2, 4, 3, 6], [2, 1, 3, 4, 5, 6],
      [2, 1, 4, 3, 5, 6], [6, 1, 2, 3, 4, 5], [2, 3, 1, 4, 5, 6], [2, 3, 4, 1, 5, 6],
      [1, 3, 2, 4, 5, 6], [2, 4, 3, 1, 5, 6], [2, 5, 1, 3, 4, 6], [3, 2, 1, 4, 5, 6],
      [3, 5, 1, 2, 6, 4], [3, 1, 4, 2, 5, 6], [3, 1, 2, 4, 5, 6], [4, 1, 3, 2, 5, 6],
      [4, 1, 2, 3, 5, 6], [4, 2, 1, 3, 5, 6], [5, 1, 2, 3, 4, 6], [5, 2, 1, 3, 4, 6],
      [2, 1, 5, 3, 4, 6]
    ];

    // 基本9レース履歴
    const defaultBaseHistory = [
      [1, 2, 3, 4, 5, 6], [1, 2, 4, 3, 5, 6], [2, 4, 1, 3, 5, 6], [1, 3, 4, 2, 5, 6], [1, 4, 2, 3, 5, 6],
      [1, 4, 3, 2, 5, 6], [1, 5, 2, 3, 4, 6], [1, 5, 2, 3, 4, 6], [1, 2, 5, 3, 4, 6]
    ];

    const horseDetails = [
      { sexAge: "牡4", weight: "58.0" },
      { sexAge: "牝5", weight: "56.0" },
      { sexAge: "牡5", weight: "58.0" },
      { sexAge: "牡4", weight: "58.0" },
      { sexAge: "牝5", weight: "56.0" },
      { sexAge: "牡6", weight: "58.0" }
    ];

    function initHorses() {
      state.horses = [];
      for (let i = 1; i <= 6; i++) {
        const horseHistory = defaultBaseHistory.map(race => {
          const rank = race.indexOf(i) + 1;
          return rank > 0 ? rank : "";
        });

        state.horses.push({
          num: i,
          name: `馬番${i}`,
          winRate: 0,
          odds: 99.0,
          history: horseHistory
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initHorses();

      const select = document.getElementById('raceSelect');
      if (select) {
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `${i}回目`;
          select.appendChild(opt);
        }
        select.value = 1;
        changeRace(1);
      }
    });

    function changeRace(raceIndex) {
      calculateRaceDisplay(raceIndex);
      renderShutubaTable();
    }

    function calculateRaceDisplay(raceIndex) {
      raceIndex = parseInt(raceIndex);
      const deductionRate = 0.25;

      state.horses.forEach((h) => {
        let winCount = 0;
        let total = 0;

        // 1. 追加21レース分の合算
        extraRaceHistory.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        // 2. 選択回数時点までの合算
        const sliced = (h.history || []).slice(0, raceIndex);
        sliced.forEach(v => {
          if (v !== "" && !isNaN(v)) {
            total++;
            if (parseInt(v) === 1) winCount++;
          }
        });

        const winRate = total > 0 ? winCount / total : 0;
        h.winRate = winRate;

        if (winRate > 0) {
          let rawOdds = (1 - deductionRate) / winRate;
          let calculated = Math.floor(rawOdds * 10) / 10;
          h.odds = Math.min(Math.max(calculated, 1.0), 99.0);
        } else {
          h.odds = 99.0;
        }
      });
    }

    function renderShutubaTable() {
      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const wakuClasses = ['waku-1', 'waku-2', 'waku-3', 'waku-4', 'waku-5', 'waku-6', 'waku-7', 'waku-8'];

      state.horses.forEach((h, i) => {
        const tr = document.createElement('tr');
        const wakuNum = i + 1;
        const wakuClass = wakuClasses[i % 8];
        const detail = horseDetails[i] || { sexAge: "牡4", weight: "58.0" };

        tr.innerHTML = `
          <td class="${wakuClass}">${wakuNum}</td>
          <td style="font-weight: bold;">${h.num}</td>
          <td><button style="padding: 2px 6px; font-size: 0.8rem; background: #f0f0f0; border: 1px solid #ccc; border-radius: 3px;">--</button></td>
          <td class="horse-name">${h.name}</td>
          <td>${detail.sexAge}</td>
          <td>${detail.weight}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showCurrentRaceResult() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = parseInt(raceSelect.value);
      const targetIdx = selectedRace - 1;

      let rank1 = "-", rank2 = "-", rank3 = "-";

      state.horses.forEach(h => {
        const r = String(h.history[targetIdx]);
        if (r === "1") rank1 = `馬番${h.num} (${h.name})`;
        if (r === "2") rank2 = `馬番${h.num} (${h.name})`;
        if (r === "3") rank3 = `馬番${h.num} (${h.name})`;
      });

      alert(`【第${selectedRace}回 レース結果】\n\n🥇 1着: ${rank1}\n🥈 2着: ${rank2}\n🥉 3着: ${rank3}`);
    }
  </script>
</body>
</html>
