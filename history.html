<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出馬表 | 横浜サイエンスフロンティア杯</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shutuba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      background-color: #fff;
    }
    .shutuba-table th {
      background-color: #f2f2f2;
      color: #333;
      font-weight: bold;
      border: 1px solid #ccc;
      padding: 6px 4px;
      text-align: center;
    }
    .shutuba-table td {
      border: 1px solid #e0e0e0;
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
    }
    
    /* 馬番の枠色スタイル（色指定） */
    .color-white  { background-color: #ffffff; color: #000; font-weight: bold; } /* 白 */
    .color-black  { background-color: #222222; color: #fff; font-weight: bold; } /* 黒 */
    .color-red    { background-color: #e53935; color: #fff; font-weight: bold; } /* 赤 */
    .color-blue   { background-color: #1e88e5; color: #fff; font-weight: bold; } /* 青 */
    .color-yellow { background-color: #fdd835; color: #000; font-weight: bold; } /* 黄 */
    .color-green  { background-color: #43a047; color: #fff; font-weight: bold; } /* 緑 */
    .color-orange { background-color: #fb8c00; color: #fff; font-weight: bold; } /* 橙・オレンジ */
    .color-pink   { background-color: #f48fb1; color: #fff; font-weight: bold; } /* 桃色・ピンク */
    .color-cyan   { background-color: #00bcd4; color: #fff; font-weight: bold; } /* 水色 */

    .horse-name {
      font-weight: bold;
      color: #000080;
      text-align: left;
      padding-left: 8px !important;
    }

    .row-input {
      width: 45px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .control-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    select, button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>出馬表</h1>
  </header>

  <div class="container">
    <div class="config-card">
      <h2 id="raceTitle" style="font-size: 1.2rem; margin-bottom: 4px;">第1回 横浜サイエンスフロンティア杯 (外周 1600m) </h2>
      
      <div class="control-panel">
        <label for="raceSelect"><strong>表示: </strong></label>
        <select id="raceSelect" onchange="changeRace(this.value)">
          <!-- JSで自動生成 -->
        </select>
        <button id="btnShowResult" class="btn btn-secondary" onclick="showCurrentRaceResult()">結果表示</button>
        <button id="btnResetDisplay" class="btn btn-danger" onclick="resetToShutubaTable()">reset</button>
      </div>
    </div>

    <!-- 出馬表 -->
    <div class="table-container">
      <table class="shutuba-table">
        <thead>
          <tr id="tableHeader">
            <th style="width: 45px;">馬番</th>
            <th style="width: 60px;">列</th>
            <th>馬名</th>
            <th style="width: 70px;">勝率</th>
            <th style="width: 70px;">オッズ</th>
          </tr>
        </thead>
        <tbody id="shutubaTableBody">
          <!-- JSで動的生成 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.state = window.state || { deductionRate: 0.25, horses: [] };

    // 馬名ごとの色設定マップ
    const horseColorMap = {
      "アサノヒカリノナカデ": "color-cyan",
      "イノイノックス": "color-pink",
      "ウオｗカ": "color-red",
      "エルコンドルカサー": "color-pink",
      "エンサンブラック": "color-black",
      "オノフェーブル": "color-cyan",
      "カスキン": "color-red",
      "キシラギエース": "color-black",
      "ケイイチパンドラ": "color-blue",
      "ゴールドシップ": "color-red",
      "サカモト": "color-orange",
      "サオリキャプ": "color-cyan",
      "サイエンススズカ": "color-black",
      "ツインメイド": "color-black",
      "ツルミルツヨシ": "color-red",
      "ナカハマフェスタ": "color-red",
      "ナオイゴールド": "color-white",
      "ハルキシャトル": "color-black",
      "ハイセンスサイエンス": "color-orange",
      "ハイセンスナサイエンス": "color-orange",
      "パッション": "color-pink",
      "ヒダリニマガール": "color-pink",
      "ヒダリノセネームウオ": "color-cyan",
      "フォーカスゴールド": "color-red",
      "ブドウトウフェチ": "color-cyan",
      "ヤエノササキ": "color-black",
      "ラクラクラク": "color-black"
    };

    const raceHorseNames = [
      ["ハルキシャトル", "ヒダリノセネームウオ", "ツルミルツヨシ", "ヒダリニマガール", "サカモト", "ナオイゴールド"],
      ["サイエンススズカ", "ナオイゴールド", "ケイイチパンドラ", "ヤエノササキ", "ラクラクラク", "ハイセンスサイエンス"],
      ["パッション", "キシラギエース", "ナカハマフェスタ", "イノイノックス", "フォーカスゴールド", "アサノヒカリノナカデ"],
      ["ハルキシャトル", "ヒダリニマガール", "ツルミルツヨシ", "ヒダリノセネームウオ", "ナオイゴールド", "サカモト"],
      ["ナオイゴールド", "ブドウトウフェチ", "エンサンブラック", "キシラギエース", "カスキン", "ハイセンスナサイエンス"],
      ["エンサンブラック", "サイエンススズカ", "キシラギエース", "イノイノックス", "ゴールドシップ", "ナオイゴールド"],
      ["ツルミルツヨシ", "ナオイゴールド", "ヒダリノセネームウオ", "サカモト", "ハルキシャトル", "ヒダリニマガール"],
      ["サイエンススズカ", "ナオイゴールド", "ヤエノササキ", "ケイイチパンドラ", "ラクラクラク", "ハイセンスナサイエンス"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["ハルキシャトル", "ヒダリノセネームウオ", "ツルミルツヨシ", "ナオイゴールド", "ヒダリニマガール", "サカモト"],
      ["キシラギエース", "ハイセンスナサイエンス", "ブドウトウフェチ", "カスキン", "エンサンブラック", "ナオイゴールド"],
      ["エンサンブラック", "ナオイゴールド", "イノイノックス", "サイエンススズカ", "ゴールドシップ", "キシラギエース"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["ナオイゴールド", "ケイイチパンドラ", "ハイセンスナサイエンス", "ヤエノササキ", "サイエンススズカ", "ラクラクラク"],
      ["ハイセンスナサイエンス", "キシラギエース", "カスキン", "ブドウトウフェチ", "ナオイゴールド", "エンサンブラック"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["エンサンブラック", "キシラギエース", "ブドウトウフェチ", "カスキン", "ハイセンスナサイエンス", "ナオイゴールド"],
      ["エンサンブラック", "サイエンススズカ", "キシラギエース", "ナオイゴールド", "イノイノックス", "ゴールドシップ"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["サオリキャプ", "ウオｗカ", "オノフェーブル", "ツインメイド", "エルコンドルカサー", "ナオイゴールド"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"],
      ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"]
    ];

    const raceLocations = [
      "外周 1100m", "花月総持寺公園 400m 1", "学校（競歩）300m ", "外周 1100m ", "学校（競歩）300m ",
      "花月総持寺公園 皐月賞 400m ", "外周 1100m ", "花月総持寺公園 400m ", "学校（競歩） ", "外周 1100m ",
      "学校（競歩）", "花月総持寺公園 400m ", "外周 1600m ", "花月総持寺公園 400m ", "学校（競歩）300m ",
      "外周 1100m ", "学校（競歩）300m ", "花月総持寺 菊花賞 400m ", "外周 1100m ", "花月総持寺 公園 400m ",
      "学校（競歩）300m ", "外周 1100m ", "学校（競歩）300m ", "SSH（重賞）200m ", "外周 1100m ",
      "花月総持寺公園 400m ", "学校内（競歩）300m ", "外周 1100m ", "学校（競歩） 300m ", "花月総持寺公演 有馬記念（重賞）400m "
    ];

    const extraRaceHistory = [
      [1, 2, 3, 4, 5, 6], [1, 6, 2, 3, 4, 5], [1, 5, 2, 4, 3, 6], [2, 1, 3, 4, 5, 6],
      [1, 4, 2, 3, 5, 6], [6, 1, 2, 3, 4, 5], [2, 3, 1, 4, 5, 6], [2, 3, 4, 1, 5, 6],
      [1, 2, 5, 3, 4, 6], [2, 4, 3, 1, 5, 6], [2, 5, 1, 3, 4, 6], [3, 2, 1, 4, 5, 6],
      [2, 1, 3, 4, 5, 6], [3, 1, 4, 2, 5, 6], [3, 1, 2, 4, 5, 6], [4, 1, 3, 2, 5, 6],
      [2, 3, 4, 1, 5, 6], [4, 2, 1, 3, 5, 6], [5, 1, 2, 3, 4, 6], [5, 2, 1, 3, 4, 6],
      [3, 2, 1, 4, 5, 6]
    ];

    const defaultBaseHistory = [
      [1, 2, 3, 4, 5, 6], [1, 2, 4, 3, 5, 6], [2, 4, 1, 3, 5, 6], [1, 3, 4, 2, 5, 6],
      [1, 4, 2, 3, 5, 6], [1, 4, 3, 2, 5, 6], [1, 5, 2, 3, 4, 6], [1, 5, 2, 3, 4, 6],
      [1, 2, 5, 3, 4, 6], [1, 3, 5, 2, 4, 6], [1, 6, 2, 3, 4, 5], [1, 5, 2, 4, 3, 6],
      [2, 1, 3, 4, 5, 6], [2, 1, 4, 3, 5, 6], [6, 1, 2, 3, 4, 5], [2, 3, 1, 4, 5, 6],
      [2, 3, 4, 1, 5, 6], [1, 3, 2, 4, 5, 6], [2, 4, 3, 1, 5, 6], [2, 5, 1, 3, 4, 6],
      [3, 2, 1, 4, 5, 6], [3, 5, 1, 2, 6, 4], [3, 1, 4, 2, 5, 6], [3, 1, 2, 4, 5, 6],
      [4, 1, 3, 2, 5, 6], [4, 1, 2, 3, 5, 6], [4, 2, 1, 3, 5, 6], [5, 1, 2, 3, 4, 6],
      [5, 2, 1, 3, 4, 6], [2, 1, 5, 3, 4, 6]
    ];

    const columnHistory = [
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6], [1, 2, 3, 4, 5, 6]
    ];

    function initHorses() {
      state.horses = [];
      for (let i = 1; i <= 6; i++) {
        state.horses.push({
          num: i,
          name: `馬番${i}`,
          winRate: 0,
          odds: 99.0,
          columnVal: "",
          history: defaultBaseHistory.map(race => {
            const rank = race.indexOf(i) + 1;
            return rank > 0 ? rank : "";
          })
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initHorses();

      const select = document.getElementById('raceSelect');
      if (select) {
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `${i}回目`;
          select.appendChild(opt);
        }
        select.value = 1;
      }

      changeRace(1);
    });

    function changeRace(raceIndex) {
      calculateRaceDisplay(raceIndex);
      updateRaceTitle(raceIndex);
      renderShutubaTable();
    }

    function resetToShutubaTable() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = raceSelect ? raceSelect.value : 1;
      changeRace(selectedRace);
    }

    function updateRaceTitle(raceIndex) {
      const idx = parseInt(raceIndex) - 1;
      const locationText = raceLocations[idx] || "不明なコース";
      
      const titleElement = document.getElementById('raceTitle');
      if (titleElement) {
        titleElement.textContent = `第${raceIndex}回 横浜サイエンスフロンティア杯 (${locationText})`;
      }
    }

    function calculateRaceDisplay(raceIndex) {
      raceIndex = parseInt(raceIndex);
      const idx = raceIndex - 1;
      const deductionRate = 0.25;

      const currentNames = raceHorseNames[idx] || ["馬番1", "馬番2", "馬番3", "馬番4", "馬番5", "馬番6"];
      const currentColumns = columnHistory[idx] || [1, 2, 3, 4, 5, 6];

      state.horses.forEach((h) => {
        h.name = currentNames[h.num - 1] || `馬番${h.num}`;
        h.columnVal = currentColumns[h.num - 1] !== undefined ? currentColumns[h.num - 1] : "";

        let winCount = 0;
        let total = 0;

        extraRaceHistory.forEach(race => {
          const rank = race.indexOf(h.num) + 1;
          if (rank > 0) {
            total++;
            if (rank === 1) winCount++;
          }
        });

        const sliced = (h.history || []).slice(0, raceIndex - 1);
        sliced.forEach(v => {
          if (v !== "" && !isNaN(v)) {
            total++;
            if (parseInt(v) === 1) winCount++;
          }
        });

        const winRate = total > 0 ? winCount / total : 0;
        h.winRate = winRate;

        if (winRate > 0) {
          let rawOdds = (1 - deductionRate) / winRate;
          let calculated = Math.floor(rawOdds * 10) / 10;
          h.odds = Math.min(Math.max(calculated, 1.0), 99.0);
        } else {
          h.odds = 99.0;
        }
      });
    }

    function updateColumnVal(horseNum, val) {
      const horse = state.horses.find(h => h.num === horseNum);
      if (horse) {
        horse.columnVal = val;
      }
    }

    // 馬名から対応する枠色クラスを取得（未設定時は枠番(1-8)ベースにフォールバック）
    function getHorseColorClass(horseName, horseNum) {
      if (horseColorMap[horseName]) {
        return horseColorMap[horseName];
      }
      const wakuClasses = ['color-white', 'color-black', 'color-red', 'color-blue', 'color-yellow', 'color-green', 'color-orange', 'color-pink'];
      return wakuClasses[(horseNum - 1) % 8];
    }

    function renderShutubaTable() {
      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 45px;">馬番</th>
        <th style="width: 60px;">列</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      state.horses.forEach((h) => {
        const tr = document.createElement('tr');
        const colorClass = getHorseColorClass(h.name, h.num);

        tr.innerHTML = `
          <td class="${colorClass}">${h.num}</td>
          <td><input type="number" class="row-input" value="${h.columnVal !== undefined ? h.columnVal : ''}" onchange="updateColumnVal(${h.num}, this.value)" min="1" max="99"></td>
          <td class="horse-name">${h.name}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showCurrentRaceResult() {
      const raceSelect = document.getElementById('raceSelect');
      const selectedRace = parseInt(raceSelect.value);
      const targetIdx = selectedRace - 1;

      const resultList = state.horses.map(h => {
        const rank = parseInt(h.history[targetIdx]) || 99;
        return { ...h, currentRank: rank };
      }).sort((a, b) => a.currentRank - b.currentRank);

      document.getElementById('tableHeader').innerHTML = `
        <th style="width: 45px;">着順</th>
        <th style="width: 45px;">馬番</th>
        <th style="width: 60px;">列</th>
        <th>馬名</th>
        <th style="width: 70px;">勝率</th>
        <th style="width: 70px;">オッズ</th>
      `;

      const tbody = document.getElementById('shutubaTableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      resultList.forEach((h) => {
        const tr = document.createElement('tr');
        const colorClass = getHorseColorClass(h.name, h.num);
        const rankDisplay = h.currentRank <= 6 ? `${h.currentRank}着` : '-';

        tr.innerHTML = `
          <td style="font-weight: bold; color: #d32f2f;">${rankDisplay}</td>
          <td class="${colorClass}">${h.num}</td>
          <td><input type="number" class="row-input" value="${h.columnVal !== undefined ? h.columnVal : ''}" onchange="updateColumnVal(${h.num}, this.value)" min="1" max="99"></td>
          <td class="horse-name">${h.name}</td>
          <td>${(h.winRate * 100).toFixed(1)}%</td>
          <td style="font-weight: bold;">${h.odds.toFixed(1)}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
